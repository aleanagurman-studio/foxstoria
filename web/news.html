<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новости — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=168">
  <script src="site.js?v=96"></script>
  <script src="news.js?v=10"></script>
</head>
<body>
  <header class="header"></header>
  <div class="layout page">
    <aside class="sidebar-left">
      <nav class="sidebar-nav">
        <a href="index.html"><img src="assets/deco/paw.svg" alt=""> Главное</a>
        <a href="catalog.html"><img src="assets/deco/sparcle.svg" alt=""> Каталог</a>
        <a href="authors.html"><img src="assets/deco/leaf.svg" alt=""> Авторы</a>
        <a href="profile.html"><img src="assets/deco/fox.svg" alt=""> Мой профиль</a>
        <a href="author-home.html"><img src="assets/deco/upload.svg" alt=""> Кабинет автора</a>
        <a href="library.html"><img src="assets/deco/bookmark.svg" alt=""> Кабинет читателя</a>
      </nav>
      <div class="sidebar-ornament" aria-hidden="true">
        <img src="assets/deco/уголок.svg" alt="">
      </div>
    </aside>
    <main class="main page-main">
      <header class="news-hero">
        <div class="news-hero-copy">
          <h1>Новости <img class="title-leaf" src="assets/deco/3.svg" alt=""></h1>
          <p>Оповещения о важных обновлениях сайта и ивентах.</p>
          <p class="news-hero-actions">
            <button type="button" class="btn btn-primary" data-owner-only hidden data-open-compose>Новый пост</button>
          </p>
        </div>
        <div class="news-hero-art" aria-hidden="true">
          <img src="assets/brand/news-desk.png?v=4" alt="">
        </div>
      </header>

      <nav class="news-cats" aria-label="Рубрики новостей">
        <button type="button" class="news-cat-btn is-on" data-news-cat="all">Все новости</button>
        <button type="button" class="news-cat-btn" data-news-cat="Анонсы">Анонсы</button>
        <button type="button" class="news-cat-btn" data-news-cat="Обновления">Обновления</button>
        <button type="button" class="news-cat-btn" data-news-cat="Ивенты">Ивенты</button>
      </nav>

      <h2 class="news-feed-title">Лента</h2>

      <section class="news-compose" id="news-compose" hidden>
        <h2>Новый пост</h2>
        <form>
          <div class="filter-grid">
            <div class="filter-group">
              <label for="news-category">Рубрика</label>
              <select id="news-category" name="category">
                <option>Анонсы</option>
                <option>Обновления</option>
                <option>Ивенты</option>
              </select>
            </div>
            <div class="filter-group filter-group-wide">
              <label for="news-title">Название</label>
              <input id="news-title" name="title" type="text" required placeholder="Новая версия редактора…">
            </div>
          </div>
          <div class="filter-group">
            <label>Обложка</label>
            <input type="file" accept="image/*" data-cover-input>
            <img data-cover-preview alt="" hidden>
          </div>
          <div class="filter-group">
            <label>Текст</label>
            <div class="news-editor-toolbar">
              <label class="btn btn-outline">Вставить картинку в текст
                <input type="file" accept="image/*" hidden data-insert-image>
              </label>
            </div>
            <div id="news-editor" class="news-editor" contenteditable="true" data-placeholder="Текст поста. Картинку можно вставить в любое место."></div>
          </div>
          <div class="filter-actions">
            <button type="submit" class="btn btn-primary">Опубликовать</button>
            <button type="button" class="btn btn-outline" data-cancel>Отмена</button>
          </div>
        </form>
      </section>

      <div id="news-feed" class="news-feed"></div>
    </main>
  </div>
  <footer class="page-footer"><img class="footer-art-img" src="assets/brand/footer-corner.jpg" alt=""></footer>
</body>
</html>
