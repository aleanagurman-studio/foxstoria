<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои истории — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=150">
  <script src="site.js?v=62"></script>
</head>
<body class="cabinet-page">
  <header class="header"></header>
  <div class="layout page">
    <aside class="sidebar-left">
      <nav class="sidebar-nav">
        <a href="index.html"><img src="assets/deco/paw.svg" alt=""> Главное</a>
        <a href="catalog.html"><img src="assets/deco/sparcle.svg" alt=""> Каталог</a>
        <a href="authors.html"><img src="assets/deco/leaf.svg" alt=""> Авторы</a>
        <a href="profile.html"><img src="assets/deco/fox.svg" alt=""> Мой профиль</a>
        <a href="author-home.html"><img src="assets/deco/upload.svg" alt=""> Кабинет автора</a>
        <a href="library.html"><img src="assets/deco/bookmark.svg" alt=""> Кабинет читателя</a>
      </nav>
      <div class="sidebar-ornament" aria-hidden="true">
        <img src="assets/deco/уголок.svg" alt="">
      </div>
    </aside>
    <main class="main page-main">
      <div class="cabinet-top">
        <div class="cabinet-head">
          <img class="cabinet-fox" src="assets/brand/лисичка.png" alt="">
          <header class="cabinet-hero">
            <div class="cabinet-hero-copy">
              <h1>Мои истории <img class="title-leaf" src="assets/deco/3.svg" alt=""></h1>
              <p>Ваши истории и проекты, над которыми вы работаете.</p>
            </div>
          </header>
          <a href="studio.html" class="btn btn-primary cabinet-new">+ Новая история</a>
        </div>
        <div class="account-tabs cabinet-tabs" data-account-tabs>
          <button type="button" class="active" data-tab="all"><img src="assets/deco/paw.svg" alt=""> Все работы <span data-cabinet-count="all">0</span></button>
          <button type="button" data-tab="author"><img src="assets/svg/profile.svg" alt=""> Автор <span data-cabinet-count="author">0</span></button>
          <button type="button" data-tab="coauthor"><img src="assets/svg/пейринг.svg" alt=""> Соавтор <span data-cabinet-count="coauthor">0</span></button>
          <button type="button" data-tab="editor"><img src="assets/svg/редактировать.svg" alt=""> Редактор <span data-cabinet-count="editor">0</span></button>
        </div>
      </div>
      <div class="cabinet-body">
      <div class="cabinet-body-main">
      <div class="cabinet-toolbar">
        <label class="cabinet-search">
          <span class="visually-hidden">Поиск по названию</span>
          <img src="assets/svg/search.svg" alt="">
          <input type="text" placeholder="Поиск по названию..." data-cabinet-search autocomplete="off">
        </label>
        <select data-cabinet-sort aria-label="Сортировка">
          <option value="updated" selected>Последнее изменение</option>
          <option value="title">По названию</option>
        </select>
        <select data-cabinet-status aria-label="Статус работы">
          <option value="all" selected>Все статусы</option>
          <option value="draft">Черновик</option>
          <option value="in_progress">В процессе</option>
          <option value="completed">Завершена</option>
        </select>
        <div class="cabinet-view" role="group" aria-label="Вид">
          <button type="button" class="is-active" data-cabinet-view="grid" aria-label="Сетка">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
          </button>
          <button type="button" data-cabinet-view="list" aria-label="Список">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="2" width="14" height="2" rx="0.5"/><rect x="1" y="7" width="14" height="2" rx="0.5"/><rect x="1" y="12" width="14" height="2" rx="0.5"/></svg>
          </button>
        </div>
      </div>
      <section id="tab-all">
        <div class="cabinet-grid" data-feed="author-home-all"></div>
      </section>
      <section id="tab-author" hidden>
        <div class="cabinet-grid" data-feed="author-home-author"></div>
      </section>
      <section id="tab-coauthor" hidden>
        <div class="cabinet-grid" data-feed="author-home-coauthor"></div>
      </section>
      <section id="tab-editor" hidden>
        <div class="cabinet-grid" data-feed="author-home-editor"></div>
      </section>
      <nav class="cabinet-pager" aria-label="Страницы">
        <button type="button" disabled aria-label="Назад">‹</button>
        <button type="button" class="is-current">1</button>
        <button type="button">2</button>
        <button type="button">3</button>
        <span>…</span>
        <button type="button">5</button>
        <button type="button" aria-label="Вперёд">›</button>
      </nav>
      </div>
      <aside class="cabinet-waiting" aria-labelledby="cabinet-waiting-title">
        <h2 id="cabinet-waiting-title"><img src="assets/svg/ждули.svg" alt=""> Ждут продолжения</h2>
        <div data-cabinet-waiting></div>
      </aside>
      </div>
    </main>
  </div>
  <footer class="page-footer"><img class="footer-art-img" src="assets/brand/footer-corner.jpg" alt=""></footer>
  <script src="catalog.js?v=38" defer></script>
</body>
</html>
