<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сборники — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=174">
  <script src="site.js?v=78"></script>
</head>
<body class="collections-page">
  <header class="header"></header>
  <div class="layout page">
    <aside class="sidebar-left">
      <nav class="sidebar-nav">
        <a href="index.html"><img src="assets/deco/paw.svg" alt=""> Главное</a>
        <a href="catalog.html"><img src="assets/deco/sparcle.svg" alt=""> Каталог</a>
        <a href="authors.html"><img src="assets/deco/leaf.svg" alt=""> Авторы</a>
        <a href="profile.html"><img src="assets/deco/fox.svg" alt=""> Мой профиль</a>
        <a href="author-home.html"><img src="assets/deco/upload.svg" alt=""> Кабинет автора</a>
        <a href="library.html"><img src="assets/deco/bookmark.svg" alt=""> Кабинет читателя</a>
      </nav>
      <div class="sidebar-ornament" aria-hidden="true">
        <img src="assets/deco/уголок.svg" alt="">
      </div>
    </aside>
    <main class="main page-main">
      <header class="page-header page-header-row">
        <div>
          <h1>Сборники <img class="title-leaf" src="assets/deco/3.svg" alt=""></h1>
          <p>Все ваши сборники и сборники, за которыми вы следите.</p>
        </div>
        <button type="button" class="btn btn-primary" data-pack-create-open>+ Новый сборник</button>
      </header>
      <div class="account-tabs" data-account-tabs>
        <button type="button" class="active" data-tab="mine">Мои</button>
        <button type="button" data-tab="subs">Подписки</button>
      </div>
      <div class="cabinet-toolbar">
        <select data-pack-sort aria-label="Сортировка">
          <option value="new" selected>По дате обновления</option>
          <option value="old">Сначала старые</option>
        </select>
        <div class="cabinet-view" role="group" aria-label="Вид">
          <button type="button" class="is-active" data-pack-view="grid" aria-label="Плитка">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
          </button>
          <button type="button" data-pack-view="list" aria-label="Список">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="2" width="14" height="2" rx="0.5"/><rect x="1" y="7" width="14" height="2" rx="0.5"/><rect x="1" y="12" width="14" height="2" rx="0.5"/></svg>
          </button>
        </div>
      </div>
      <section id="tab-mine">
        <div class="pack-grid" data-pack-feed="mine"></div>
      </section>
      <section id="tab-subs" hidden>
        <div class="pack-grid" data-pack-feed="subs"></div>
      </section>
    </main>
  </div>
  <footer class="page-footer"><img class="footer-art-img" src="assets/brand/footer-corner.jpg" alt=""></footer>
  <script src="collections.js?v=12" defer></script>
</body>
</html>
