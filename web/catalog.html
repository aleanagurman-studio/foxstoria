<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=75">
  <script src="site.js?v=19"></script>
  <script src="catalog.js?v=8" defer></script>
</head>
<body>
  <header class="header"></header>

  <div class="layout page">
    <aside class="sidebar-left">
      <nav class="sidebar-nav">
        <a href="index.html"><img src="assets/deco/paw.svg" alt=""> Главное</a>
        <a href="catalog.html" class="active"><img src="assets/deco/sparcle.svg" alt=""> Каталог</a>
        <a href="authors.html"><img src="assets/deco/leaf.svg" alt=""> Авторы</a>
        <a href="profile.html"><img src="assets/deco/fox.svg" alt=""> Мой профиль</a>
        <a href="author-home.html"><img src="assets/deco/upload.svg" alt=""> Кабинет автора</a>
        <a href="library.html"><img src="assets/deco/bookmark.svg" alt=""> Кабинет читателя</a>
      </nav>
      <div class="sidebar-ornament" aria-hidden="true">
        <img src="assets/deco/уголок.svg" alt="">
      </div>
    </aside>

    <main class="main page-main">
      <header class="page-header">
        <h1>Каталог работ</h1>
        <p>Интерактивные и линейные истории в одном месте. Тип можно выбрать ниже или в расширенном поиске.</p>
      </header>
      <div class="catalog-toolbar">
        <div class="type-tabs" data-catalog-tabs>
          <a href="catalog.html" class="type-tab" data-type="">Все</a>
          <a href="catalog.html?type=interactive" class="type-tab" data-type="interactive">Интерактивные</a>
          <a href="catalog.html?type=linear" class="type-tab" data-type="linear">Линейные</a>
        </div>
        <a href="search.html" class="btn btn-outline">Расширенный поиск</a>
      </div>
      <div class="sort-bar">
        <span>Сортировка:</span>
        <button type="button" class="sort-btn active" data-sort="popular">Популярные</button>
        <button type="button" class="sort-btn" data-sort="rating">По рейтингу</button>
        <button type="button" class="sort-btn" data-sort="latest">Новинки</button>
      </div>
      <div class="stories-grid" data-feed="catalog"></div>
    </main>
  </div>
  <footer class="page-footer"><img class="footer-art-img" src="assets/brand/footer-corner.jpg" alt=""></footer>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const type = new URLSearchParams(location.search).get("type") || "";
      document.querySelectorAll("[data-catalog-tabs] .type-tab").forEach((tab) => {
        tab.classList.toggle("active", tab.getAttribute("data-type") === type);
      });
    });
  </script>
</body>
</html>
