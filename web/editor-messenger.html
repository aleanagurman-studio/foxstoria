<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор мессенджеров — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=220">
  <link rel="stylesheet" href="editor.css?v=44">
  <link rel="stylesheet" href="editor-linear.css?v=50">
  <link rel="stylesheet" href="editor-messenger.css?v=2">
  <script src="site.js?v=110"></script>
</head>
<body class="editor-page editor-linear-page editor-messenger-page">
  <header class="editor-header">
    <button type="button" class="side-toggle" data-side-toggle aria-controls="side-panel" aria-expanded="false" aria-label="Оглавление">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a href="index.html" class="logo">
      <img src="assets/brand/logo.png" alt="">
      <span>FoxStoria</span>
    </a>

    <div class="story-title-block">
      <h1 id="story-title" class="story-title-text">Без названия</h1>
    </div>

    <div class="mode-tabs">
      <button type="button" class="mode-tab active" data-mode="edit">Редактор</button>
      <button type="button" class="mode-tab" data-mode="preview">Просмотр</button>
    </div>

    <div class="editor-toolbar">
      <button type="button" class="theme-btn" id="theme-toggle" aria-label="Переключить тему">
        <img class="theme-moon" src="assets/deco/moon.svg" alt="">
        <img class="theme-day" src="assets/deco/день.svg" alt="">
      </button>
      <a href="author-home.html" class="btn btn-outline" id="studio-link">Кабинет</a>
    </div>
  </header>

  <div class="editor-layout" id="editor-root" data-side-layout>
    <aside class="editor-left" id="side-panel" data-side-panel>
      <div class="linear-toc">
        <div class="panel-header">
          <button type="button" class="panel-toggle" data-side-toggle aria-controls="side-panel" aria-expanded="false">Оглавление</button>
        </div>
        <div class="structure-search linear-toc-search">
          <img src="assets/svg/search.svg" alt="">
          <input type="search" id="chapter-search" placeholder="Поиск по главам">
        </div>
        <div class="structure-tree" id="chapter-list"></div>
        <button type="button" class="btn-new-scene" id="add-chapter">+ Добавить главу</button>
      </div>

      <div class="linear-lib">
        <div class="linear-lib-tabs" role="tablist">
          <button type="button" class="linear-lib-tab active" role="tab" aria-selected="true" data-lib="chars">Персонажи</button>
          <button type="button" class="linear-lib-tab" role="tab" aria-selected="false" data-lib="notes">Заметки</button>
        </div>
        <div class="linear-lib-lists">
          <div class="linear-lib-list" id="character-list" data-lib-panel="chars"></div>
          <div class="linear-lib-list" id="note-list" data-lib-panel="notes" hidden></div>
        </div>
        <button type="button" class="linear-lib-add" id="lib-add-char" data-lib-panel="chars">+ Добавить персонажа</button>
        <button type="button" class="linear-lib-add" id="lib-add-note" data-lib-panel="notes" hidden>+ Новая заметка</button>
      </div>
    </aside>

    <div class="editor-center linear-center">
      <div class="messenger-editor-wrap" id="edit-surface">
        <div class="messenger-sheet">
          <h2 class="messenger-sheet-title" id="sheet-title" contenteditable="true" spellcheck="true" data-placeholder="Название главы"></h2>
          <p class="messenger-hint">В главу можно добавить от 1 до 15 скриншотов. Читатель листает их касанием краёв картинки.</p>
          <div class="messenger-slots" id="image-slots"></div>
          <div class="messenger-add-row">
            <button type="button" class="btn btn-outline" id="add-images-btn">Добавить картинки</button>
            <span class="messenger-count" id="image-count">0 / 15</span>
            <input type="file" id="image-file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
          </div>
        </div>
      </div>

      <div class="linear-chapter-bar" id="linear-chapter-bar">
        <div class="linear-chapter-actions">
          <label class="linear-ending">
            <input type="checkbox" id="chapter-ending">
            Конец
          </label>
          <div class="chapter-status" id="chapter-status">
            <button type="button" class="chapter-status-btn" id="chapter-status-btn" aria-expanded="false" aria-haspopup="listbox">
              <span id="chapter-status-label">Статус: Черновик</span>
              <svg class="chapter-status-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 6.2 8 10.5l4.5-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="chapter-status-menu" id="chapter-status-menu" hidden role="listbox">
              <button type="button" role="option" data-status="published" aria-checked="false">Опубликовано<span class="chapter-status-check"></span></button>
              <button type="button" role="option" data-status="draft" aria-checked="false">Черновик<span class="chapter-status-check"></span></button>
              <button type="button" role="option" data-status="scheduled" aria-checked="false">Отложить<span class="chapter-status-check"></span></button>
            </div>
          </div>
          <button type="button" class="btn btn-primary editor-save-btn" id="editor-save-btn">Сохранить</button>
          <div class="chapter-status-schedule" id="chapter-status-schedule" hidden>
            <label class="chapter-status-opt">
              <input type="radio" name="chapter-sched-mode" value="date">
              Дата публикации
            </label>
            <input type="datetime-local" id="chapter-publish-at">
            <label class="chapter-status-opt">
              <input type="radio" name="chapter-sched-mode" value="wait">
              Когда ждущих наберётся
            </label>
            <div class="chapter-status-wait-row">
              <input type="number" id="chapter-publish-wait" min="1" step="1" inputmode="numeric">
              <span class="chapter-status-wait-hint" id="chapter-wait-now"></span>
            </div>
          </div>
        </div>
      </div>

      <article class="linear-preview messenger-preview" id="preview" hidden>
        <div class="linear-read-body linear-preview-inner">
          <div class="messenger-gallery" id="preview-gallery">
            <button type="button" class="linear-edit-btn messenger-expand-btn" id="preview-fit" aria-label="Растянуть картинку" aria-pressed="false">
              <img src="assets/svg/hfcibhbnm.svg" alt="">
            </button>
            <div class="messenger-gallery-frame" id="preview-frame">
              <img id="preview-image" alt="">
              <button type="button" class="messenger-hit messenger-hit--left" id="preview-img-prev" aria-label="Предыдущая картинка"></button>
              <button type="button" class="messenger-hit messenger-hit--right" id="preview-img-next" aria-label="Следующая картинка"></button>
            </div>
            <p class="messenger-gallery-empty" id="preview-empty" hidden>В этой главе пока нет картинок.</p>
          </div>
          <nav class="linear-chap-nav messenger-chap-nav">
            <button type="button" class="linear-chap-btn" id="preview-prev">
              <img src="assets/svg/left.svg" alt="">
              <span>
                <b>Предыдущая</b>
                <small id="preview-prev-name"></small>
              </span>
            </button>
            <span class="messenger-slide-count" id="preview-count">1/1</span>
            <button type="button" class="linear-chap-btn linear-chap-btn--next" id="preview-next">
              <span>
                <b>Следующая</b>
                <small id="preview-next-name"></small>
              </span>
              <img src="assets/svg/right.svg" alt="">
            </button>
          </nav>
        </div>
      </article>
    </div>
  </div>

  <div class="linear-peek" id="linear-peek" hidden>
    <div class="linear-peek-card">
      <button type="button" class="linear-peek-close" id="peek-close" aria-label="Закрыть">×</button>
      <div id="peek-body"></div>
    </div>
  </div>

  <div class="linear-lib-modal" id="lib-modal" hidden>
    <div class="linear-lib-modal-backdrop" id="lib-modal-dismiss"></div>
    <form class="linear-lib-modal-card" id="lib-modal-form">
      <h3 id="lib-modal-heading">Новый персонаж</h3>
      <div id="lib-fields-char">
        <label>Имя
          <input type="text" id="lib-char-name" autocomplete="off">
        </label>
        <label>Возраст
          <textarea id="lib-char-age" rows="1"></textarea>
        </label>
        <label>Кратко о персонаже
          <textarea id="lib-char-bio" rows="4"></textarea>
        </label>
        <label>Черты
          <textarea id="lib-char-traits" rows="3"></textarea>
        </label>
      </div>
      <div id="lib-fields-note" hidden>
        <label>Название
          <input type="text" id="lib-note-title" autocomplete="off">
        </label>
        <label>Текст заметки
          <textarea id="lib-note-text" rows="8"></textarea>
        </label>
      </div>
      <div class="linear-lib-modal-foot">
        <button type="button" class="btn btn-ghost" id="lib-modal-delete" hidden>Удалить</button>
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  </div>

  <script src="editor-messenger.js?v=6"></script>
</body>
</html>
