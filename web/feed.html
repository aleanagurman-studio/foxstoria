<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя лента — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=223">
  <script src="site.js?v=116"></script>
  <script src="feed.js?v=12"></script>
</head>
<body class="feed-page">
  <header class="header"></header>
  <div class="layout page">
    <aside class="sidebar-left">
      <nav class="sidebar-nav">
        <a href="index.html"><img src="assets/deco/paw.svg" alt=""> Главное</a>
        <a href="catalog.html"><img src="assets/deco/sparcle.svg" alt=""> Каталог</a>
        <a href="authors.html"><img src="assets/deco/leaf.svg" alt=""> Авторы</a>
        <a href="profile.html"><img src="assets/deco/fox.svg" alt=""> Мой профиль</a>
        <a href="author-home.html"><img src="assets/deco/upload.svg" alt=""> Кабинет автора</a>
        <a href="library.html"><img src="assets/deco/bookmark.svg" alt=""> Кабинет читателя</a>
      </nav>
      <div class="sidebar-ornament" aria-hidden="true">
        <img src="assets/deco/уголок.svg" alt="">
      </div>
    </aside>
    <main class="main page-main">
      <header class="feed-hero">
        <div class="page-header">
          <h1>Моя лента <img class="title-leaf" src="assets/deco/3.svg" alt=""></h1>
          <p>Все обновления из ваших подписок: новые главы, посты в блогах, обновления сборников и другое.</p>
        </div>
        <div class="feed-hero-aside">
          <aside class="feed-stats" aria-label="Общая статистика подписок">
            <div class="feed-subs-total">
              <b data-feed-subs-total>0</b>
              <span>подписок</span>
            </div>
            <ul class="feed-subs-split">
              <li class="feed-subs-authors"><img src="assets/deco/перо1.svg" alt=""> <span><b data-feed-subs="authors">0</b>авторов</span></li>
              <li class="feed-subs-works"><img src="assets/svg/читать.svg" alt=""> <span><b data-feed-subs="works">0</b>работ</span></li>
              <li class="feed-subs-blogs"><img src="assets/deco/блог.svg" alt=""> <span><b data-feed-subs="blogs">0</b>блогов</span></li>
              <li class="feed-subs-collections"><img src="assets/deco/сборник.svg" alt=""> <span><b data-feed-subs="collections">0</b>сборников</span></li>
            </ul>
          </aside>
        </div>
      </header>

      <div class="feed-toolbar">
        <div class="account-tabs cabinet-tabs" id="feed-tabs">
          <button type="button" class="active" data-feed-tab="all"><img src="assets/deco/paw.svg" alt=""> Вся лента</button>
          <button type="button" data-feed-tab="works"><img src="assets/svg/читать.svg" alt=""> Работы</button>
          <button type="button" data-feed-tab="blogs"><img src="assets/deco/блог.svg" alt=""> Блоги</button>
          <button type="button" data-feed-tab="collections"><img src="assets/deco/сборник.svg" alt=""> Сборники</button>
          <button type="button" data-feed-tab="authors"><img src="assets/svg/profile.svg" alt=""> Авторы</button>
        </div>
        <label class="feed-sort">
          <span class="visually-hidden">Сортировка</span>
          <select id="feed-sort">
            <option value="new">Сначала новые</option>
            <option value="old">Сначала старые</option>
          </select>
        </label>
      </div>

      <div id="feed-stream" class="feed-stream"></div>
      <p class="feed-more-wrap">
        <button type="button" class="btn btn-outline" id="feed-more" hidden>Загрузить ещё</button>
      </p>
    </main>
  </div>
  <footer class="page-footer"><img class="footer-art-img" src="assets/brand/footer-corner.jpg" alt=""></footer>
</body>
</html>
