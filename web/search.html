<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js"></script>
  <script src="taxonomy.js"></script>
  <script src="catalog.js" defer></script>
</head>
<body>
  <header class="header"></header>

  <div class="layout page">
    <aside class="sidebar-left">
            <nav class="sidebar-nav">
        <a href="index.html"><img src="assets/deco/paw.svg" alt=""> Главное</a>
        <a href="stories-interactive.html"><img src="assets/deco/sparcle.svg" alt=""> Интерактивные</a>
        <a href="stories-linear.html"><img src="assets/ornaments/08_open_book.svg" alt=""> Линейные</a>
        <a href="authors.html"><img src="assets/deco/leaf.svg" alt=""> Авторы</a>
        <a href="profile.html"><img src="assets/deco/fox.svg" alt=""> Мой профиль</a>
        <a href="author-home.html"><img src="assets/deco/upload.svg" alt=""> Кабинет автора</a>
        <a href="library.html"><img src="assets/deco/bookmark.svg" alt=""> Кабинет читателя</a>
      </nav>
      <div class="sidebar-ornament" aria-hidden="true">
        <img src="assets/deco/уголок.svg" alt="">
      </div>
    </aside>

    <main class="main page-main">
      <header class="page-header">
        <h1>Поиск работ</h1>
        <p>Фильтры по типу, фандому, направленности, жанрам, предупреждениям и формату. Кинки — только у 18+.</p>
      </header>
      <form class="filter-panel" action="search.html">
        <div class="filter-grid">
          <div class="filter-group">
            <label for="q">Название</label>
            <input id="q" name="q" type="search" placeholder="Название истории…">
          </div>
          <div class="filter-group">
            <label for="story_type">Тип</label>
            <select id="story_type" name="type">
              <option value="">Любой</option>
              <option value="interactive">Интерактивная</option>
              <option value="linear">Линейная</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="genre">Жанр</label>
            <select id="genre" name="genre" data-tax-select="genres" data-empty="Любой">
              <option value="">Любой</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="format">Формат</label>
            <select id="format" name="format" data-tax-select="formats" data-empty="Любой">
              <option value="">Любой</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="warning">Предупреждение</label>
            <select id="warning" name="warning" data-tax-select="warnings" data-empty="Любое">
              <option value="">Любое</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="kink-filter">Кинк</label>
            <select id="kink-filter" name="kink" data-tax-select="kinks" data-empty="Любой">
              <option value="">Любой</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="fandom">Фандом</label>
            <select id="fandom" name="fandom">
              <option value="">Любой</option>
              <option>Ориджинал</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="romance">Направленность</label>
            <select id="romance" name="romance">
              <option value="">Любая</option>
              <option value="gen">Джен</option>
              <option value="het">Гет</option>
              <option value="slash">Слэш</option>
              <option value="femslash">Фемслэш</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="age">Возраст</label>
            <select id="age" name="age">
              <option value="">Любой</option>
              <option value="none">Без рейтинга</option>
              <option value="16+">16+</option>
              <option value="18+">18+</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="status">Статус</label>
            <select id="status" name="status">
              <option value="">Любой</option>
              <option value="in_progress">В процессе</option>
              <option value="completed">Завершена</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="size">Размер</label>
            <select id="size" name="size">
              <option value="">Любой</option>
              <option value="mini">Мини — до 20 глав</option>
              <option value="midi">Миди — до 50 глав</option>
              <option value="maxi">Макси</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button type="submit" class="btn btn-primary">Найти</button>
          <a href="search.html" class="btn btn-outline">Сбросить</a>
        </div>
      </form>
      <div class="stories-grid" data-feed="catalog"></div>
    </main>
  </div>
  <footer class="page-footer"><img class="footer-art-img" src="assets/brand/footer-corner.jpg" alt=""></footer>
</body>
</html>
