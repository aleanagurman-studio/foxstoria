<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки — FoxStoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <script src="site.js"></script>
</head>
<body class="account-page">
  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">Fox<span>Storia</span></span>
    </a>
    <nav class="nav-main">
      <a href="index.html">Главная</a>
      <a href="stories-interactive.html">Каталог</a>
    </nav>
    <div class="header-actions">
      <button class="circle-btn" id="theme-toggle" aria-label="Тема"><svg class="ico"><use href="#i-moon"></use></svg></button>
    </div>
  </header>
  <div class="account-layout">
    <aside class="account-side">
      <p class="side-kicker">Личное меню</p>
      <a href="profile.html">Профиль</a>
      <a href="messages.html">Сообщения</a>
      <a href="author-home.html">Кабинет автора</a>
      <a href="library.html">Кабинет читателя</a>
      <a href="settings.html" class="active">Настройки</a>
    </aside>
    <main class="account-main">
      <h1 style="font-family:var(--font-display);margin-bottom:20px">Настройки</h1>

      <section class="settings-block">
        <h2>Пароль и вход</h2>
        <input type="email" value="moon@foxstoria.example" readonly>
        <input type="password" placeholder="Новый пароль" autocomplete="new-password">
        <input type="password" placeholder="Ещё раз" autocomplete="new-password">
        <p class="profile-meta">Позже: почта, Google, Apple.</p>
      </section>

      <section class="settings-block">
        <h2>Оповещения</h2>
        <label>Комментарии к работам <input type="checkbox" checked></label>
        <label>Новые подписчики <input type="checkbox" checked></label>
        <label>Личные сообщения <input type="checkbox" checked></label>
        <label>Обновления подписок <input type="checkbox" checked></label>
      </section>

      <section class="settings-block">
        <h2>Чёрный список</h2>
        <article class="account-card">
          <strong>Гостевой аккаунт</strong>
          <p class="profile-meta">Не видит ваши посты и не может писать</p>
        </article>
      </section>

      <section class="settings-block">
        <h2>Редактор</h2>
        <label>Автосохранение <input type="checkbox" checked></label>
        <label>Мини-карта графа <input type="checkbox" checked></label>
      </section>
    </main>
  </div>
</body>
</html>
