<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=75">
  <script src="site.js?v=19"></script>
  </head>
<body>
  <header class="header"></header>

  <div class="layout page">
    <aside class="sidebar-left">
            <nav class="sidebar-nav">
        <a href="index.html"><img src="assets/deco/paw.svg" alt=""> Главное</a>
        <a href="catalog.html"><img src="assets/deco/sparcle.svg" alt=""> Каталог</a>
        <a href="authors.html"><img src="assets/deco/leaf.svg" alt=""> Авторы</a>
        <a href="profile.html"><img src="assets/deco/fox.svg" alt=""> Мой профиль</a>
        <a href="author-home.html"><img src="assets/deco/upload.svg" alt=""> Кабинет автора</a>
        <a href="library.html"><img src="assets/deco/bookmark.svg" alt=""> Кабинет читателя</a>
      </nav>
      <div class="sidebar-ornament" aria-hidden="true">
        <img src="assets/deco/уголок.svg" alt="">
      </div>
    </aside>

    <main class="main page-main">
        <nav class="account-subnav">
          <a href="profile.html">Профиль</a>
          <a href="messages.html">Сообщения</a>
          <a href="author-home.html">Кабинет автора</a>
          <a href="library.html">Кабинет читателя</a>
          <a href="settings.html" class="active">Настройки</a>
        </nav>

      <header class="page-header">
        <h1>Настройки</h1>
      </header>
      <section class="settings-block">
        <h2>Пароль и вход</h2>
        <input type="email" value="you@foxstoria.example" readonly>
        <input type="password" placeholder="Новый пароль" autocomplete="new-password">
        <input type="password" placeholder="Ещё раз" autocomplete="new-password">
        <p class="profile-meta">Позже: почта, Google, Apple.</p>
      </section>
      <section class="settings-block">
        <h2>Оповещения</h2>
        <label>Комментарии к работам <input type="checkbox" checked></label>
        <label>Новые подписчики <input type="checkbox" checked></label>
        <label>Личные сообщения <input type="checkbox" checked></label>
        <label>Обновления подписок <input type="checkbox" checked></label>
      </section>
      <section class="settings-block">
        <h2>Чёрный список</h2>
        <article class="account-card">
          <strong>Пока пусто</strong>
          <p class="profile-meta">Скрытые аккаунты появятся здесь</p>
        </article>
      </section>
      <section class="settings-block">
        <h2>Редактор</h2>
        <label>Автосохранение <input type="checkbox" checked></label>
        <label>Мини-карта графа <input type="checkbox" checked></label>
      </section>
    </main>
  </div>
  <footer class="page-footer"><img class="footer-art-img" src="assets/brand/footer-corner.jpg" alt=""></footer>
</body>
</html>
