<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поддержка — FoxStoria</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=75">
  <script src="site.js?v=19"></script>
</head>
<body>
  <header class="header"></header>
  <div class="layout page">
    <aside class="sidebar-left">
      <nav class="sidebar-nav">
        <a href="index.html"><img src="assets/deco/paw.svg" alt=""> Главное</a>
        <a href="catalog.html"><img src="assets/deco/sparcle.svg" alt=""> Каталог</a>
        <a href="authors.html"><img src="assets/deco/leaf.svg" alt=""> Авторы</a>
        <a href="profile.html"><img src="assets/deco/fox.svg" alt=""> Мой профиль</a>
        <a href="author-home.html"><img src="assets/deco/upload.svg" alt=""> Кабинет автора</a>
        <a href="library.html"><img src="assets/deco/bookmark.svg" alt=""> Кабинет читателя</a>
      </nav>
      <div class="sidebar-ornament" aria-hidden="true">
        <img src="assets/deco/уголок.svg" alt="">
      </div>
    </aside>
    <main class="main page-main">
      <header class="page-header">
        <h1>Написать в поддержку</h1>
        <p>Сообщите о сбое, ошибке в тексте или вопросе по аккаунту.</p>
      </header>
      <form class="settings-block" data-support-form>
        <label>Тема
          <input type="text" name="topic" required placeholder="Коротко, о чём письмо">
        </label>
        <label>Сообщение
          <textarea name="body" rows="6" required placeholder="Что произошло и на какой странице"></textarea>
        </label>
        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
      <p class="empty-feed" data-support-done hidden>Мы получили обращение и ответим на почту аккаунта.</p>
    </main>
  </div>
  <footer class="page-footer"><img class="footer-art-img" src="assets/brand/footer-corner.jpg" alt=""></footer>
</body>
</html>
