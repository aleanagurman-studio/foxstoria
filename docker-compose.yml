services:
  db:
    image: postgres:16-alpine
    container_name: foxstoria-db
    environment:
      POSTGRES_USER: foxstoria
      POSTGRES_PASSWORD: foxstoria
      POSTGRES_DB: foxstoria
    ports:
      - "5432:5432"
    volumes:
      - foxstoria_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxstoria -d foxstoria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  foxstoria_pg:
